<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elárion</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Rye&display=swap" rel="stylesheet">

  <style>
    /* Page background */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Rye', cursive;
      background-image: 
        linear-gradient(rgba(21, 27, 24, 0.7), rgba(21, 27, 24, 0.7)),
        url('https://raw.githubusercontent.com/razurialdesul1001/dndstuff/main/elarion.png');
      background-size: cover;
      background-position: center;
      color: #f4f1e9;
    }

    /* Header Banner */
    header {
      background: url('https://www.transparenttextures.com/patterns/wood-pattern.png'),
                  linear-gradient(#3e2c1a, #2b1c11);
      background-blend-mode: overlay;
      border: 4px solid #6a4b32;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      text-align: center;
      max-width: 900px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.7);
    }

    header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3rem;
      color: #f5e6d0;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
      margin: 0;
    }

    /* Sample content */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Elárion</h1>
  </header>

  <main>
    <p>Welcome to the world of Elárion. A realm of stone, wood, and steel — where legends are carved into history.</p>
  </main>
</body>
</html>
